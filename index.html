<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Түргэн Тоншуул</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=PT+Mono&display=swap" rel="stylesheet">
<style>
/* VOICE: тоглоомлог, дулаахан, 6-р ангийн хүүхдэд ойлгомжтой — гэхдээ цэгцтэй
   IDEA: модон дээр тоншиж буй тоншуул = товчлуур тоншиж буй хуруу; сургуулийн 4 өнгө = 4 үнэт зүйл
   PICTURE: модны их бие дээр товчлуур тоншиж буй тоншуул; бичих хэсэгт өнгөт хуруутай гар
   COLOUR+TYPE: нарлаг шар дэвсгэр, тоншуулын улаан, гүн хөх бэх; 130-р сургуулийн нил ягаан/ногоон/цэнхэр/шар; Nunito + PT Mono
   LAYOUT: дээд цэс → том зурагтай нүүр → эрхэм зорилго → зорилго → үнэт зүйл → ангийн мод; утсанд нэг багана */
:root{color-scheme:light dark;
--bg:light-dark(#fff6dc,#16182b);--card:light-dark(#ffffff,#22253d);--ink:light-dark(#1f2550,#f4f1e6);--mut:light-dark(#5b6188,#a9acc8);
--red:#ff5a4e;--red2:light-dark(#e8392d,#ff7a6f);--blue:light-dark(#1f2a5a,#8fa8ff);--leaf:light-dark(#2f9e62,#5fd394);--sun:#ffc93c;
--line:light-dark(#efdfb4,#33375a);--soft:light-dark(#fff0c4,#2b2f4c);
--s1:#8a4cc2;--s2:#43a843;--s3:#2d78d2;--s4:#e3a100;
--f0:#b79cff;--f1:#6fb2ff;--f2:#4fd49a;--f3:#ffc93c;--f4:#ff9f4a;--f8:light-dark(#dfe3ee,#4a4f72)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{line-height:1.1;text-wrap:balance;margin:0 0 .4em}
h1{font-size:clamp(32px,5vw,50px);font-weight:900}h2{font-size:clamp(25px,3vw,34px);font-weight:900}h3{font-size:20px;font-weight:800}
a{color:var(--red2)}
.band{padding:clamp(20px,3.5vw,44px) max(4vw,16px)}.wrap{max-width:1180px;margin:0 auto}
button,.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:11px 18px;min-height:44px;cursor:pointer;background:var(--red);color:#fff;box-shadow:0 4px 0 #c23a30;transition:transform .08s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #c23a30}
button.ghost,.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
button.leaf{background:var(--leaf);box-shadow:0 4px 0 light-dark(#1d7346,#2f9e62)}
button.sm{padding:6px 12px;min-height:38px;box-shadow:none;font-size:15px}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:44px;width:100%}
label{font-weight:700;font-size:15px;display:block;margin:10px 0 4px}
.card{background:var(--card);border-radius:22px;padding:20px;border:2px solid var(--line)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut)}.small{font-size:14px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:800;background:var(--soft);color:var(--ink)}
.vchip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;color:#fff}
.note{font-size:14px;color:var(--mut);margin-top:8px}
/* header */
.stripe{display:grid;grid-template-columns:repeat(4,1fr);height:6px}.stripe i:nth-child(1){background:var(--s1)}.stripe i:nth-child(2){background:var(--s2)}.stripe i:nth-child(3){background:var(--s3)}.stripe i:nth-child(4){background:var(--s4)}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--line)}
.bar{display:flex;gap:8px;align-items:center;padding:8px max(4vw,16px);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:21px;color:var(--ink);text-decoration:none;margin-right:auto;line-height:1.05}
.logo small{display:block;font-size:12px;font-weight:700;color:var(--mut)}
.logo svg{width:38px;height:38px}
.badge130{width:40px;height:40px;border-radius:50%;background:#fff;padding:2px;object-fit:contain;border:2px solid var(--line)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--ink);text-decoration:none;font-weight:800;font-size:15px;padding:8px 11px;border-radius:12px}
nav a.on{background:var(--red);color:#fff}
.who{font-size:14px;font-weight:800;background:var(--soft);padding:8px 12px;border-radius:12px;cursor:pointer;border:0;color:var(--ink);box-shadow:none;min-height:40px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:center}
.hero p{font-size:19px;max-width:34em}
.hero svg{width:100%;height:auto;max-height:430px}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr))}
.tile{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;text-decoration:none;color:var(--ink);display:block;transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile b{font-size:18px;display:block}.tile span{font-size:14px;color:var(--mut)}
.tile i{display:block;width:42px;height:42px;border-radius:14px;margin-bottom:10px}
/* mission, goals, values */
.mission{background:var(--card);border-radius:26px;padding:clamp(20px,3vw,36px);border:2px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start}
.mission .q{font-size:clamp(20px,2.4vw,27px);font-weight:700;line-height:1.4}
.mission .q b{font-weight:900}
.mission .mark{font-size:80px;line-height:.8;color:var(--s4);font-weight:900}
.goals{display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr))}
.goal{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;border-top:8px solid var(--c)}
.goal .n{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px;margin-bottom:10px}
.goal h3{font-size:22px}
.vals{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr))}
.val{background:var(--c);color:#fff;border-radius:22px;padding:20px;min-height:200px;display:flex;flex-direction:column}
.val h3{font-size:24px;margin:6px 0 8px}.val p{margin:0;font-size:15px;opacity:.95}
.val .stat2{margin-top:auto;padding-top:12px;font-weight:900;font-size:15px}
.tree .r{display:grid;grid-template-columns:44px minmax(0,1fr) 70px;gap:10px;align-items:center;margin:6px 0}
.tree .bar2{height:26px;border-radius:10px;background:var(--soft);overflow:hidden}
.tree .bar2 i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--leaf),var(--sun))}
.an .r{grid-template-columns:minmax(0,130px) minmax(50px,1fr) auto}.an .r b{font-size:14px;line-height:1.2}
.tree .v{font-weight:900;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* lessons */
.lessons{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.les{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;color:var(--ink);box-shadow:none;font-weight:600;justify-content:flex-start}
.les .n{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:var(--sun);color:#1f2550}
.les .n.done{background:var(--leaf);color:#fff}
.les small{display:block;color:var(--mut);font-size:13px}
.les.lock{opacity:.55;cursor:not-allowed}.les.lock .n{background:var(--line);color:var(--mut)}
.tabs button:disabled{opacity:.5}
summary{min-height:44px;display:flex;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:var(--card);color:var(--ink);box-shadow:none;border:2px solid var(--line);padding:8px 14px}
.tabs button.on{background:var(--blue);color:light-dark(#fff,#16182b);border-color:var(--blue)}
/* typing */
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:14px 0}
.stat{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 10px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}.stat span{font-size:13px;color:var(--mut);font-weight:700}
.text{font-family:"PT Mono",ui-monospace,monospace;font-size:clamp(21px,2.8vw,29px);line-height:1.75;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:18px 22px;letter-spacing:.02em;word-break:break-word;min-height:120px;max-height:330px;overflow:auto}
.text span{border-radius:6px;padding:0 1px}.text .wd{font-style:normal;white-space:nowrap}
.text .ok{color:var(--leaf)}.text .bad{background:#ffd6d2;color:#b3261e}
.text .cur{background:var(--sun);color:#1f2550;box-shadow:0 3px 0 var(--red)}
.text .cur.err{background:var(--red);color:#fff;animation:shake .2s}
.text .nl{color:var(--mut)}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.hint{font-weight:800;margin:10px 0;min-height:28px}
.hint em{font-style:normal;padding:2px 10px;border-radius:10px;color:#1f2550}
.newkeys{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.newkeys span{padding:4px 10px;border-radius:12px;font-weight:800;font-size:14px;color:#1f2550}
.kb{background:light-dark(#2a3160,#0f1122);padding:12px;border-radius:22px;margin-top:10px;overflow-x:auto}
.kbin{min-width:640px;display:grid;gap:6px}
.kr{display:flex;gap:6px}
.k{flex:1 1 0;height:46px;border-radius:10px;background:var(--f8);color:#1f2550;display:flex;flex-direction:column;justify-content:center;align-items:center;font-weight:800;font-size:17px;position:relative;line-height:1;border-bottom:4px solid rgba(0,0,0,.25)}
.k small{font-size:10px;opacity:.65;position:absolute;top:4px;left:6px}
.k.w15{flex-grow:1.5}.k.w18{flex-grow:1.85}.k.w22{flex-grow:2.3}.k.sp{flex-grow:7}
.kb.color .k[data-f="0"],.kb.color .k[data-f="7"]{background:var(--f0)}
.kb.color .k[data-f="1"],.kb.color .k[data-f="6"]{background:var(--f1)}
.kb.color .k[data-f="2"],.kb.color .k[data-f="5"]{background:var(--f2)}
.kb.color .k[data-f="3"]{background:var(--f3)}.kb.color .k[data-f="4"]{background:var(--f4)}
.k.home::after{content:"";position:absolute;bottom:6px;width:12px;height:2px;background:#1f2550;border-radius:2px}
.k.next{background:#fff!important;outline:4px solid var(--red);transform:translateY(-2px);animation:pulse 1s infinite}
@keyframes pulse{50%{outline-color:var(--sun)}}
.hands{display:flex;justify-content:center;gap:60px;margin-top:12px}
.hand{display:flex;gap:6px;align-items:flex-end}
.fg{width:24px;border-radius:12px 12px 6px 6px;background:var(--f8);opacity:.55}
.fg.on{opacity:1;outline:3px solid var(--red)}
.opts{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0;font-weight:700;font-size:15px}
.opts label{display:flex;gap:6px;align-items:center;margin:0}.opts input{width:22px;min-height:22px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,22,45,.55);display:none;place-items:center;z-index:50;padding:16px;overflow:auto}
.modal.on{display:grid}.modal .card{max-width:560px;width:100%;text-align:center}
.stars{font-size:46px;letter-spacing:6px;color:var(--sun)}.stars .off{color:var(--line)}
/* theory */
.theory{max-width:840px}
.sec{border-radius:20px;padding:18px 20px;margin:16px 0;background:var(--card);border:2px solid var(--line)}
.sec h3{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sec code{font-family:"PT Mono",monospace;background:var(--soft);padding:1px 6px;border-radius:6px;word-break:break-all}
.tag{font-size:13px;font-weight:900;padding:4px 10px;border-radius:99px;color:#1f2550}
.t-o{background:#ffd98a}.t-m{background:#a6e3c4}.t-c{background:#b9d3ff}.t-h{background:#ffc2b8}.t-a{background:#e0cdff}.t-x{background:#ffe1a8}
table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;border-bottom:2px solid var(--line);text-align:left;vertical-align:top}th{font-size:14px;color:var(--mut)}
.def{background:var(--soft);border-radius:16px;padding:12px 16px;font-weight:700;margin:10px 0;border-left:6px solid var(--s3)}
.fb{font-weight:700;margin-top:8px;min-height:1.4em}
.fb.ok{color:var(--leaf)}.fb.no{color:var(--red2)}
/* game */
.arena{position:relative;height:430px;border-radius:22px;overflow:hidden;background:linear-gradient(light-dark(#bfe7ff,#1c2350),light-dark(#e9f7ff,#2a3160));border:3px solid var(--line)}
.arena .w{position:absolute;font-family:"PT Mono",monospace;font-weight:700;font-size:22px;background:var(--card);color:var(--ink);padding:4px 10px;border-radius:12px;box-shadow:0 3px 0 var(--line);white-space:nowrap}
.arena .w.hit{background:var(--sun);color:#1f2550}
.arena .ground{position:absolute;left:0;right:0;bottom:0;height:34px;background:var(--leaf)}
.arena .over{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.hud{display:flex;gap:16px;font-weight:900;font-size:18px;margin:8px 0;flex-wrap:wrap}
/* questions */
.qcard{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;margin:14px 0}
.qcard .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.choice{display:flex;gap:10px;align-items:center;padding:10px 14px;border:2px solid var(--line);border-radius:14px;margin:6px 0;cursor:pointer;font-weight:600}
.choice input{width:22px;min-height:22px;flex:none}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;margin:6px 0}
.ord{display:flex;gap:8px;align-items:center;padding:8px 10px;border:2px solid var(--line);border-radius:14px;margin:6px 0;background:var(--bg)}
.ord span{flex:1}.ord button{padding:4px 12px;min-height:38px;box-shadow:none}
.timer{position:sticky;top:70px;z-index:5;background:var(--blue);color:light-dark(#fff,#16182b);padding:10px 16px;border-radius:16px;font-weight:900;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rev{border-left:6px solid var(--leaf)}.rev.no{border-left-color:var(--red)}
.code{font-size:34px;font-weight:900;letter-spacing:6px;font-family:"PT Mono",monospace}
.scroll{overflow-x:auto}
.terms .t{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:2px solid var(--line)}
.demo{font-size:13px;color:var(--mut);font-style:italic}
.chk{display:flex;gap:8px;align-items:flex-start;font-weight:600;font-size:15px}.chk input{width:22px;min-height:22px;flex:none;margin-top:2px}
footer{padding:30px max(4vw,16px);color:var(--mut);font-size:14px;text-align:center}
@media(max-width:900px){.goals{grid-template-columns:1fr}.vals{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){.hero{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.hands{gap:24px}}
@media(max-width:600px){nav a{padding:6px 8px;font-size:14px}.terms .t{grid-template-columns:1fr;gap:2px}.mrow{grid-template-columns:1fr}table{font-size:14px}.vals{grid-template-columns:1fr}.mission{grid-template-columns:1fr}.mission .mark{display:none}
.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:2px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;font-weight:700;color:var(--mut)}.stack td:empty{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#syncdot[data-st=local]{display:none}
.syncbanner{background:#fff3cd;color:#5c4400;border:1px solid #e0b100;border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:14px}
.ltc{display:inline-block;min-width:44px;text-align:center;padding:3px 7px;border-radius:9px;font-weight:800;font-size:13px}
.lt-g{background:#c9f2d8;color:#145c32}.lt-y{background:#ffe9a8;color:#6b4d00}.lt-r{background:#ffd0c9;color:#8a1c0c}
.ltres{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:16px;padding:14px 16px;margin:8px 0 12px}
.ltres .big{font-size:40px;font-weight:900;line-height:1}
.lttimer{position:sticky;top:8px;z-index:5;display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border-radius:14px;padding:8px 14px;font-weight:800;margin-bottom:10px}
.qana{display:grid;gap:6px}.qana .qbar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}.qana .qbar>span{display:block;height:100%;border-radius:6px}
.evrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:2px solid var(--line)}
.evopts{display:flex;gap:6px;flex-wrap:wrap}.evb{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none;padding:6px 10px;font-size:13px;font-weight:700;border-radius:12px;display:inline-flex;gap:5px;align-items:center}
.evb.on{background:var(--leaf);border-color:var(--leaf);color:#fff}.evstars{display:flex;gap:4px}.evst{background:none;box-shadow:none;border:0;font-size:34px;line-height:1;color:var(--line);padding:0 2px}.evst.on{color:#ffb400}
@media(max-width:640px){.evrow{grid-template-columns:1fr}}
.oprow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:2px solid var(--line)}.oprow small{display:block;color:var(--mut)}
.opst{font-size:12px;font-weight:800;padding:3px 9px;border-radius:9px}.opst.on{background:#c9f2d8;color:#145c32}.opst.off{background:var(--soft);color:var(--mut)}
.stk{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line)}.stk i{display:block;height:100%}
.notes{display:flex;flex-wrap:wrap;gap:8px}.notes span{background:var(--soft);border-radius:12px;padding:6px 10px;font-size:13px}
</style>
</head>
<body>
<header><div class="stripe"><i></i><i></i><i></i><i></i></div><div class="bar">
  <a class="logo" href="#home"><img class="badge130" src="logo130.png" alt="130-р сургууль"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#bird"/></svg><span>Түргэн Тоншуул<small>130-р сургууль · 6-р анги</small></span></a>
  <nav id="nav"><a href="#typing" data-v="typing">Бичих</a><a href="#theory" data-v="theory">Онол</a><a href="#terms" data-v="terms">Нэр томьёо</a><a href="#game" data-v="game">Тоглоом</a><a href="#speed" data-v="speed">Хурд</a><a href="#exam" data-v="exam">Шалгалт</a></nav>
  <span id="syncdot" data-st="local"></span>
 <button class="who" id="who">Нэвтрэх</button>
</div></header>
<svg width="0" height="0" style="position:absolute"><defs>
<g id="bird"><path d="M24 50 L18 63 L30 55Z" fill="#1f2550"/><ellipse cx="32" cy="38" rx="13" ry="19" fill="#1f2550"/><ellipse cx="35" cy="42" rx="8" ry="13" fill="#fff"/><path d="M22 34 q4 10 12 12" stroke="#fff" stroke-width="3" fill="none"/><circle cx="30" cy="20" r="11" fill="#1f2550"/><path d="M19 18 Q20 4 34 7 Q26 9 24 22Z" fill="#ff5a4e"/><path d="M22 23 Q30 30 39 24" stroke="#fff" stroke-width="3" fill="none"/><circle cx="34" cy="18" r="4.5" fill="#fff"/><circle cx="35" cy="18" r="2.2" fill="#1f2550"/><path d="M40 19 L62 21.5 L40 24Z" fill="#ffc93c"/></g>

 return h+`<div class="lttimer"><span>Хичээлийн дүгнэлт шалгалт</span><span id="lttime">${ltLeft()}</span></div>${ltSt.qs.map((q,k)=>`<div class="qcard" data-lk="${k}"><div class="top"><b>${k+1}.</b><span class="pill">${TYPE_NM[q.t]}</span></div><p style="margin:0 0 8px;font-weight:700">${esc(q.q)}</p><div data-in>${qInput(q,'l'+k,ltSt.ans[k])}</div></div>`).join('')}<button class="leaf" id="ltend">Шалгалтаа илгээх</button></div>`}

 modal(`<h3>${esc(u.ovog)} ${esc(u.ner)}</h3><p>${esc(u.cls)} анги · ${doneCount(u)} дасгал · ${starsOf(u)} од · ${streak(u)} өдөр дараалан · Шилдэг хурд ${u.best?.speed||0} үг/мин</p><div class="row" style="justify-content:center"><button class="ghost" onclick="window.closeModal()">Хаах</button><button id="m-out">Гарах</button></div>`);

 modal(`<div id="rest"><h2>Нүдээ амраах цаг боллоо</h2><p>20 минут дэлгэц харлаа. 20 секунд цонхоор хол харж, мөрөө сулла.</p><p style="font-size:44px;font-weight:900;margin:6px 0" id="rs">20</p><button id="rok" disabled>Амарлаа</button></div>`);
 const t=setInterval(()=>{s--;const e=$('#rs');if(e)e.textContent=s;if(s<=0){clearInterval(t);const b=$('#rok');if(b){b.disabled=false;b.onclick=closeModal}}},1000)}},1000);

};
